<style>path,line{fill:none;stroke:#302D27;stroke-width:1.05;vector-effect:non-scaling-stroke;stroke-linejoin:round}text{fill:#302D27;font-family:Microsoft YaHei,Segoe UI,sans-serif;font-size:16px}.threshold{stroke:#587E71;stroke-dasharray:5 4}.curve{stroke:#A35F35;stroke-width:1.15}</style>
