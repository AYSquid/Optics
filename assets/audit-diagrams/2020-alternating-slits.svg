<path class="line " d="M80,86 L80,104"/>
<path class="line " d="M114,86 L114,104"/>
<text x="97" y="131" class="note" text-anchor="middle">a</text>
<path class="line " d="M114,95 L148,95" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path class="line " d="M114,86 L114,104"/>
