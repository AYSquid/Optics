<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" role="img" aria-labelledby="title"><title id="title">2021 焦面孔阑：像面、负透镜焦点、主光线及上边缘光线</title><defs><marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6" style="fill:none;stroke:context-stroke;stroke-width:.9"/></marker></defs><style>path,line,circle{fill:none;stroke:#302D27;stroke-width:1.05;vector-effect:non-scaling-stroke;stroke-linejoin:round}text{fill:#302D27;stroke:none;font-family:Microsoft YaHei,Segoe UI,sans-serif}</style><text x="25.000" y="30.000" text-anchor="start" style="font-size:16px;fill:#302D27">① 轴上光线定像面；向后延长得到 L₁ 的虚焦点</text><path d="M60.000 155.000L765.000 155.000" style="stroke:#302D27" stroke-dasharray="5 4" opacity=".65"/><path d="M300.000 80.000L300.000 260.000" style="stroke:#302D27"/><text x="300.000" y="67.000" text-anchor="middle" style="font-size:15px;fill:#302D27">L₁</text><path d="M540.000 80.000L540.000 260.000" style="stroke:#302D27"/><text x="540.000" y="67.000" text-anchor="middle" style="font-size:15px;fill:#302D27">L₂</text><path d="M420.000 85.000L420.000 125.000" style="stroke:#302D27"/><path d="M420.000 185.000L420.000 255.000" style="stroke:#302D27"/><circle cx="420.000" cy="125.000" r="2.3" style="fill:#302D27"/><text x="443.000" y="115.000" text-anchor="middle" style="font-size:15px;fill:#302D27">P₁</text><circle cx="420.000" cy="155.000" r="2.3" style="fill:#302D27"/><text x="420.000" y="179.000" text-anchor="middle" style="font-size:15px;fill:#302D27">P = F₂</text><path d="M708.000 90.000L708.000 220.000" style="stroke:#302D27" stroke-dasharray="5 4" opacity=".65"/><circle cx="708.000" cy="155.000" r="2.3" style="fill:#302D27"/><text x="723.000" y="180.000" text-anchor="middle" style="font-size:15px;fill:#302D27">A′</text><path d="M120.000 137.000L300.000 137.000L540.000 113.000L708.000 155.000" style="stroke:#9E5732" marker-end="url(#arr)"/><path d="M120.000 155.000L300.000 137.000" style="stroke:#9E5732" stroke-dasharray="5 4" opacity=".65"/><circle cx="120.000" cy="155.000" r="2.3" style="fill:#302D27"/><text x="120.000" y="180.000" text-anchor="middle" style="font-size:15px;fill:#302D27">F₁′</text><circle cx="708.000" cy="125.000" r="2.3" style="fill:#302D27"/><text x="725.000" y="117.000" text-anchor="middle" style="font-size:15px;fill:#302D27">B′</text><path d="M708.000 155.000L708.000 125.000" style="stroke:#302D27" marker-end="url(#arr)"/><text x="25.000" y="305.000" text-anchor="start" style="font-size:16px;fill:#302D27">② 孔阑在 F₂：主光线出射平行光轴；边缘光线同到 B′</text><path d="M60.000 450.000L765.000 450.000" style="stroke:#302D27" stroke-dasharray="5 4" opacity=".65"/><path d="M300.000 375.000L300.000 555.000" style="stroke:#302D27"/><text x="300.000" y="362.000" text-anchor="middle" style="font-size:15px;fill:#302D27">L₁</text><path d="M540.000 375.000L540.000 555.000" style="stroke:#302D27"/><text x="540.000" y="362.000" text-anchor="middle" style="font-size:15px;fill:#302D27">L₂</text><path d="M420.000 380.000L420.000 420.000" style="stroke:#302D27"/><path d="M420.000 480.000L420.000 550.000" style="stroke:#302D27"/><circle cx="420.000" cy="420.000" r="2.3" style="fill:#302D27"/><text x="443.000" y="410.000" text-anchor="middle" style="font-size:15px;fill:#302D27">P₁</text><circle cx="420.000" cy="450.000" r="2.3" style="fill:#302D27"/><text x="420.000" y="474.000" text-anchor="middle" style="font-size:15px;fill:#302D27">P = F₂</text><path d="M708.000 385.000L708.000 515.000" style="stroke:#302D27" stroke-dasharray="5 4" opacity=".65"/><circle cx="708.000" cy="450.000" r="2.3" style="fill:#302D27"/><text x="723.000" y="475.000" text-anchor="middle" style="font-size:15px;fill:#302D27">A′</text><path d="M120.000 555.000L300.000 480.000L420.000 450.000L540.000 420.000L708.000 420.000" style="stroke:#2D6B70" marker-end="url(#arr)"/><path d="M120.000 537.000L300.000 462.000L420.000 420.000L540.000 378.000L708.000 420.000" style="stroke:#A35F35" marker-end="url(#arr)"/><circle cx="708.000" cy="420.000" r="2.3" style="fill:#302D27"/><text x="725.000" y="412.000" text-anchor="middle" style="font-size:15px;fill:#302D27">B′</text><path d="M708.000 450.000L708.000 420.000" style="stroke:#302D27"/><text x="410.000" y="585.000" text-anchor="middle" style="font-size:13px;fill:#302D27">青蓝：主光线穿 P；橙褐：上边缘光线穿 P₁。虚线仅为辅助延长。</text></svg>