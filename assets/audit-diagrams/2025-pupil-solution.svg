<circle class="line " cx="56.1818" cy="815" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="56.1818" y="847" class="math" text-anchor="middle">P</text>
<text x="40" y="980" class="note" text-anchor="start">该布局为虚物；不能预先把 AB 放到 L₁ 左侧。</text>
<text x="40" y="1023" class="note" text-anchor="start">示意距离用于共轭校验，不是原题新增的毫米数。</text>
