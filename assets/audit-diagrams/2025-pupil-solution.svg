<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title"><title id="title">2025 虚物 AB、反转的入瞳 P₁PP₂ 与两条边缘光线</title><defs><marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6" style="fill:none;stroke:context-stroke;stroke-width:.9"/></marker></defs><style>path,line,circle{fill:none;stroke:#302D27;stroke-width:1.05;vector-effect:non-scaling-stroke;stroke-linejoin:round}text{fill:#302D27;stroke:none;font-family:Microsoft YaHei,Segoe UI,sans-serif}</style><text x="25.000" y="28.000" text-anchor="start" style="font-size:17px;fill:#302D27">先从 B′ 逆向成像，再把同一个孔阑经 L₁ 反向成瞳</text><path d="M30.000 190.000L1030.000 190.000" style="stroke:#302D27" stroke-dasharray="5 4" opacity=".65"/><path d="M320.000 60.000L320.000 315.000" style="stroke:#302D27"/><text x="320.000" y="48.000" text-anchor="middle" style="font-size:15px;fill:#302D27">L₁</text><path d="M775.000 60.000L775.000 315.000" style="stroke:#302D27"/><text x="775.000" y="48.000" text-anchor="middle" style="font-size:15px;fill:#302D27">L₂</text><circle cx="190.000" cy="190.000" r="2.3" style="fill:#302D27"/><text x="190.000" y="213.000" text-anchor="middle" style="font-size:15px;fill:#302D27">F₁</text><circle cx="450.000" cy="190.000" r="2.3" style="fill:#302D27"/><text x="450.000" y="213.000" text-anchor="middle" style="font-size:15px;fill:#302D27">F₁′</text><circle cx="645.000" cy="190.000" r="2.3" style="fill:#302D27"/><text x="645.000" y="213.000" text-anchor="middle" style="font-size:15px;fill:#302D27">F₂</text><circle cx="905.000" cy="190.000" r="2.3" style="fill:#302D27"/><text x="905.000" y="213.000" text-anchor="middle" style="font-size:15px;fill:#302D27">F₂′</text><path d="M593.000 83.000L593.000 172.000" style="stroke:#302D27"/><path d="M593.000 208.000L593.000 305.000" style="stroke:#302D27"/><circle cx="593.000" cy="172.000" r="2.3" style="fill:#302D27"/><text x="611.000" y="164.000" text-anchor="middle" style="font-size:15px;fill:#302D27">Q₁</text><circle cx="593.000" cy="190.000" r="2.3" style="fill:#302D27"/><text x="611.000" y="190.000" text-anchor="middle" style="font-size:15px;fill:#302D27">Q</text><circle cx="593.000" cy="208.000" r="2.3" style="fill:#302D27"/><text x="611.000" y="230.000" text-anchor="middle" style="font-size:15px;fill:#302D27">Q₂</text><path d="M71.818 173.636L71.818 206.364" style="stroke:#302D27"/><circle cx="71.818" cy="190.000" r="2.3" style="fill:#302D27"/><text x="56.818" y="190.000" text-anchor="middle" style="font-size:15px;fill:#302D27">P</text><circle cx="71.818" cy="206.364" r="2.3" style="fill:#302D27"/><text x="53.818" y="226.364" text-anchor="middle" style="font-size:15px;fill:#302D27">P₁</text><circle cx="71.818" cy="173.636" r="2.3" style="fill:#302D27"/><text x="53.818" y="163.636" text-anchor="middle" style="font-size:15px;fill:#302D27">P₂</text><path d="M412.857 190.000L412.857 261.429" style="stroke:#302D27" stroke-dasharray="5 4" opacity=".65"/><circle cx="412.857" cy="190.000" r="2.3" style="fill:#302D27"/><text x="399.857" y="180.000" text-anchor="middle" style="font-size:15px;fill:#302D27">A</text><circle cx="412.857" cy="261.429" r="2.3" style="fill:#302D27"/><text x="427.857" y="283.429" text-anchor="middle" style="font-size:15px;fill:#302D27">B（虚物）</text><path d="M374.167 190.000L374.167 231.667" style="stroke:#302D27" stroke-dasharray="5 4" opacity=".65"/><text x="366.167" y="249.667" text-anchor="end" style="font-size:13px;fill:#302D27">Bₘ</text><path d="M967.400 190.000L967.400 170.000" style="stroke:#302D27" marker-end="url(#arr)"/><text x="987.400" y="212.000" text-anchor="middle" style="font-size:15px;fill:#302D27">A′</text><text x="987.400" y="158.000" text-anchor="middle" style="font-size:15px;fill:#302D27">B′</text><path d="M71.818 173.636L320.000 237.525L593.000 208.000L775.000 188.317L967.400 170.000" style="stroke:#2D6B70" marker-end="url(#arr)"/><path d="M320.000 237.525L412.857 261.429" style="stroke:#2D6B70" stroke-dasharray="5 4" opacity=".65"/><path d="M71.818 190.000L320.000 241.980L593.000 190.000L775.000 155.347L967.400 170.000" style="stroke:#817465" marker-end="url(#arr)"/><path d="M320.000 241.980L412.857 261.429" style="stroke:#817465" stroke-dasharray="5 4" opacity=".65"/><path d="M71.818 206.364L320.000 246.436L593.000 172.000L775.000 122.376L967.400 170.000" style="stroke:#A35F35" marker-end="url(#arr)"/><path d="M320.000 246.436L412.857 261.429" style="stroke:#A35F35" stroke-dasharray="5 4" opacity=".65"/><text x="550.000" y="350.000" text-anchor="middle" style="font-size:14px;fill:#302D27">Q₁ → P₁ 在下方；Q₂ → P₂ 在上方。AB 是入射线的延长线交点，不是实物发光点。</text><text x="550.000" y="372.000" text-anchor="middle" style="font-size:13px;fill:#302D27">图中距离仅用于验证作图关系；原题无数值尺寸，不从照片量出数值答案。</text></svg>