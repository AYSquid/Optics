<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1390" viewBox="0 0 900 1390" role="img" aria-labelledby="title description">
<title id="title">2026 / 光阑、入瞳、出瞳与主光线</title><desc id="description">示意位置不代表原题数值；透明背景，可编辑路径与文字。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#302D27" stroke-width="1.3"/></marker>
<marker id="answer-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#346D68" stroke-width="1.4"/></marker>
</defs>
<style>
.line {fill:none;stroke:#302D27;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ray {stroke-width:1.5}
.answer {stroke:#346D68;stroke-width:1.5}
text {fill:#302D27;font:28px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif}
.math {font-family:'DejaVu Sans',sans-serif;font-style:italic;font-size:30px}
.heading {font-size:30px;font-weight:600}
.note {font-size:25px}
.number {font-size:25px;fill:#346D68}
.result {fill:#346D68}
.caution {fill:#976333}
</style>
<text x="35" y="45" class="heading" text-anchor="start">2026 / 光阑、入瞳、出瞳与主光线</text>
<path class="line " d="M40,265 L865,265" stroke-dasharray="5 6"/>
<path class="line " d="M430,139 L430,391"/>
<style>
 .secondary{stroke:#976333;stroke-width:1.5}
 @media (prefers-color-scheme:dark){
 .line{stroke:#E8DCC3}text{fill:#E8DCC3}.answer{stroke:#9CCBBB}.result,.number{fill:#9CCBBB}
 .secondary{stroke:#DDB587}.caution{fill:#DDB587}
 #arrow path{stroke:#E8DCC3}#answer-arrow path{stroke:#9CCBBB}
 circle[style]{fill:#E8DCC3!important}
 }
 </style>
<text x="430" y="119" class="math" text-anchor="middle">L₁</text>
<path class="line " d="M622,139 L622,391"/>
<text x="622" y="119" class="math" text-anchor="middle">L₂</text>
<circle class="line " cx="310" cy="265" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="310" y="249" class="math" text-anchor="middle">A</text>
<circle class="line " cx="310" cy="309" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="310" y="339" class="math" text-anchor="middle">B</text>
<circle class="line " cx="762" cy="265" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="762" y="295" class="math" text-anchor="middle">A′</text>
<circle class="line " cx="526" cy="265" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="526" y="295" class="math" text-anchor="middle">Q</text>
<path class="line ray" d="M310,265 L310,309"/>
<path class="line ray" d="M310,283.48 L310,290.52" marker-end="url(#arrow)"/>
<path class="line ray" d="M310,265 L430,232 L622,218.8 L762,265"/>
<path class="line ray" d="M680.8,238.204 L703.2,245.596" marker-end="url(#arrow)"/>
<path class="line answer" d="M310,309 L430,294.333 L526,265 L622,235.667 L762,228.333"/>
<path class="line answer" d="M680.8,232.587 L703.2,231.413" marker-end="url(#answer-arrow)"/>
<circle class="line " cx="526" cy="225.4" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="556" y="210.4" class="math" text-anchor="middle">Q₁</text>
<circle class="line " cx="762" cy="228.333" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="777" y="213.333" class="math" text-anchor="middle">B′</text>
<path class="line answer" d="M762,265 L762,228.333"/>
<path class="line answer" d="M762,249.6 L762,243.733" marker-end="url(#answer-arrow)"/>
<text x="40" y="452" class="note" text-anchor="start">① 采用给定光线为上边缘光线的作图约定。</text>
<text x="40" y="495" class="note" text-anchor="start">其与 Q 所在垂面的交点为 Q₁；绿色主光线穿 Q。</text>
<path class="line " d="M35,535 L865,535" stroke-dasharray="5 6"/>
<text x="40" y="584" class="heading" text-anchor="start">② 入瞳：Q、Q₁ 经 L₁ 反向成像</text>
<path class="line " d="M40,760 L865,760" stroke-dasharray="5 6"/>
<path class="line " d="M430,680 L430,840"/>
<text x="430" y="660" class="math" text-anchor="middle">L₁</text>
<path class="line answer" d="M526,724 L430,760"/>
<path class="line answer" d="M485.68,739.12 L470.32,744.88" marker-end="url(#answer-arrow)"/>
<path class="line answer" d="M430,760 L670,670" stroke-dasharray="5 6"/>
<path class="line secondary" d="M526,724 L430,724"/>
<path class="line secondary" d="M485.68,724 L470.32,724" marker-end="url(#arrow)"/>
<path class="line secondary" d="M430,724 L670,670" stroke-dasharray="5 6"/>
<circle class="line " cx="526" cy="724" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="538" y="708" class="math" text-anchor="middle">Q₁</text>
<circle class="line " cx="526" cy="760" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="538" y="792" class="math" text-anchor="middle">Q</text>
<circle class="line " cx="670" cy="670" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="682" y="654" class="math" text-anchor="middle">P′</text>
<circle class="line " cx="670" cy="760" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="682" y="792" class="math" text-anchor="middle">P</text>
<path class="line " d="M35,866 L865,866" stroke-dasharray="5 6"/>
<text x="40" y="917" class="heading" text-anchor="start">③ 出瞳：Q、Q₁ 经 L₂ 正向成像</text>
<path class="line " d="M40,1155 L865,1155" stroke-dasharray="5 6"/>
<path class="line " d="M622,1045 L622,1265"/>
<text x="622" y="1025" class="math" text-anchor="middle">L₂</text>
<path class="line answer" d="M526,1124.4 L622,1155 L734,1190.7"/>
<path class="line answer" d="M669.04,1169.99 L686.96,1175.71" marker-end="url(#answer-arrow)"/>
<path class="line answer" d="M62,976.5 L622,1155" stroke-dasharray="5 6"/>
<path class="line secondary" d="M526,1124.4 L622,1124.4 L734,1153.98"/>
<path class="line secondary" d="M669.04,1136.82 L686.96,1141.56" marker-end="url(#arrow)"/>
<path class="line secondary" d="M62,976.5 L622,1124.4" stroke-dasharray="5 6"/>
<circle class="line " cx="526" cy="1124.4" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="526" y="1104.4" class="math" text-anchor="middle">Q₁</text>
<circle class="line " cx="526" cy="1155" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="526" y="1187" class="math" text-anchor="middle">Q</text>
<circle class="line " cx="62" cy="976.5" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="62" y="956.5" class="math" text-anchor="middle">P₁′</text>
<circle class="line " cx="62" cy="1155" r="2.4" style="fill:#302D27;stroke:none"/>
<text x="62" y="1187" class="math" text-anchor="middle">P₁</text>
<text x="40" y="1304" class="note" text-anchor="start">虚瞳用延长线定位，不能把虚线当实际传播。</text>
<text x="40" y="1347" class="note" text-anchor="start">若给定线不是边缘线，Q₁ 高度不唯一。</text>
</svg>
