<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">闪耀光栅两种入射方向的角定义</title>
  <desc id="desc">槽面与栅面夹角为phi。沿槽面法线入射时入射角和闪耀出射角均为phi；沿栅面法线入射时闪耀出射角为2phi。这是解析角定义示意，不补设原题30度的归属。</desc>
  <defs>
    <marker id="in" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto"><path d="M0 .7L6 3.5L0 6.3" fill="none" stroke="#A52D2C" stroke-width="1"/></marker>
    <marker id="out" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto"><path d="M0 .7L6 3.5L0 6.3" fill="none" stroke="#C47A4E" stroke-width="1"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#302D27;font-size:15px} .head{font-size:18px;font-weight:600}.small{font-size:13px}.surface{fill:none;stroke:#302D27;stroke-width:1.2}.guide{fill:none;stroke:#687C70;stroke-width:1;stroke-dasharray:5 4}.ray-in{fill:none;stroke:#A52D2C;stroke-width:1.25;marker-end:url(#in)}.ray-out{fill:none;stroke:#C47A4E;stroke-width:1.25;marker-end:url(#out)}.angle{fill:none;stroke:#8A795D;stroke-width:1}</style>
  </defs>
  <text x="34" y="34" class="head">沿槽面法线入射</text>
  <text x="524" y="34" class="head">沿栅面法线入射</text>
  <path d="M20 53H980" stroke="#8A795D" stroke-width=".7" opacity=".4"/>
  <path class="surface" d="M120 310L400 148V310H120"/>
  <path class="guide" d="M40 310H450M260 285V74M260 229L350 73"/>
  <text x="38" y="334" class="small">栅面</text>
  <text x="220" y="274" class="small">槽面</text>
  <text x="230" y="69" class="small">栅面法线</text>
  <text x="361" y="88" class="small">槽面法线</text>
  <path class="ray-in" d="M320 120L259 226"/>
  <path class="ray-out" d="M264 229L327 120"/>
  <path class="angle" d="M260 186A43 43 0 0 1 281.5 191.8"/>
  <text x="266" y="172">φ</text>
  <path class="angle" d="M168 310A48 48 0 0 0 161.6 286"/>
  <text x="180" y="298">φ</text>
  <text x="38" y="365">α = β = φ　　mλ = 2d sinφ</text>
  <path class="surface" d="M610 310L890 148V310H610"/>
  <path class="guide" d="M530 310H960M750 285V74M750 229L840 73"/>
  <text x="528" y="334" class="small">栅面</text>
  <text x="710" y="274" class="small">槽面</text>
  <text x="676" y="86" class="small">入射光</text>
  <text x="850" y="88" class="small">槽面法线</text>
  <path class="ray-in" d="M750 93V225"/>
  <path class="ray-out" d="M750 229L940 119"/>
  <path class="angle" d="M750 174A55 55 0 0 1 797.6 201.5"/>
  <text x="790" y="166">2φ</text>
  <path class="angle" d="M750 200A29 29 0 0 1 764.5 203.9"/>
  <text x="766" y="191" class="small">φ</text>
  <path class="angle" d="M658 310A48 48 0 0 0 651.6 286"/>
  <text x="670" y="298">φ</text>
  <text x="528" y="365">α = 0　β = 2φ　　mλ = d sin(2φ)</text>
</svg>
