<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 325" role="img" aria-labelledby="title"><title id="title">2025 坐标答案：示范采用入射x向左、y向纸外、z向上的约定</title><defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#302d27" stroke-width=".9"/></marker></defs><style>path,circle{fill:none;stroke:#302d27;stroke-width:1.15;vector-effect:non-scaling-stroke;stroke-linejoin:round}.edge{opacity:.6}.dot{fill:#302d27;stroke:none}text{fill:#302d27;font:18px 'Microsoft YaHei','Segoe UI',sans-serif;stroke:none}</style><text x="26" y="30">2025 / 坐标方向</text><text x="37" y="70">a</text><path d="M132,145L132,90" marker-end="url(#arrow)"/><path d="M132,145L197,145" marker-end="url(#arrow)"/><text x="127" y="78">x′</text><text x="205" y="150">z′</text><circle cx="132" cy="145" r="8"/><circle cx="132" cy="145" r="1.8" class="dot"/><text x="102" y="169">y′</text><text x="297" y="70">b</text><path d="M392,145L392,90" marker-end="url(#arrow)"/><path d="M392,145L457,145" marker-end="url(#arrow)"/><text x="387" y="78">x″</text><text x="465" y="150">z″</text><circle cx="392" cy="145" r="8"/><circle cx="392" cy="145" r="1.8" class="dot"/><text x="362" y="169">y″</text><text x="26" y="266">⊙ 指向纸外；⊗ 指向纸内；z 沿出射光</text><text x="26" y="302">入射约定：x 向左，y 向纸外，z 向上</text></svg>