<svg xmlns="http://www.w3.org/2000/svg" width="900" height="433" viewBox="0 0 900 433" role="img" aria-labelledby="title description">
<title id="title">2025 三棱镜系统：题图</title><desc id="description">原题无入射坐标轴。保留光路及 a、b 标签，不添加入射坐标。</desc>
<defs>
